<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lotto Trivo Analyzer</title>
<style>
  :root {
    --bg: #0b0f14;
    --card: #141a22;
    --card-hover: #1a222d;
    --border: #243041;
    --text: #e8eef7;
    --muted: #8b9bb4;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --accent: #22d3ee;
    --green-card: #0f2a1f;
    --green-border: #1a4d35;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.45;
  }

  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px 14px 40px;
  }

  /* HEADER */
  .header {
    text-align: center;
    padding: 12px 0 18px;
  }

  .logo {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, #60a5fa, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* STATUS */
  .status {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
    box-shadow: 0 0 8px var(--success);
  }

  .status.error .dot {
    background: var(--danger);
    box-shadow: 0 0 8px var(--danger);
  }

  /* BOTÕES */
  .actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }

  @media (min-width: 560px) {
    .actions {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .btn {
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
    color: #fff;
  }

  .btn-primary {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
  }

  .btn-secondary {
    background: var(--card);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: var(--card-hover);
  }

  .btn:active {
    transform: scale(0.98);
  }

  /* SEÇÕES */
  .section {
    margin-bottom: 28px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .section-badge {
    font-size: 11px;
    background: #1e293b;
    color: var(--muted);
    padding: 3px 8px;
    border-radius: 20px;
  }

  /* SUGESTÃO */
  .sugestao-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  @media (max-width: 500px) {
    .sugestao-grid {
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
  }

  .sugestao-card {
    background: linear-gradient(160deg, #0f2a1f, #0c1f17);
    border: 1px solid var(--green-border);
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
  }

  .sugestao-card .pos {
    font-size: 11px;
    color: #6ee7b7;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .sugestao-card .num {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  /* GRID GERAL */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    transition: background 0.15s;
  }

  .card:hover {
    background: var(--card-hover);
  }

  .card .rank {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .card .num {
    font-size: 22px;
    font-weight: 800;
    margin: 4px 0;
  }

  .card .meta {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* RESULTADOS */
  .draw-header {
    grid-column: 1 / -1;
    background: #1a2332;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* POSIÇÃO */
  .pos-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .pos-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .candidatos {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .candidato {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 13px;
  }

  .candidato strong {
    color: #fff;
    font-weight: 700;
  }

  .candidato span {
    color: var(--muted);
    font-size: 12px;
  }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  /* LOADING */
  .loading {
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">ANALYZER</div>
    <h1>Lotto Trivo</h1>
  </div>

  <!-- STATUS -->
  <div class="status" id="status">
    <div class="dot"></div>
    <div>Carregando sistema...</div>
  </div>

  <!-- BOTÕES -->
  <div class="actions">
    <button class="btn btn-primary" onclick="coletar()">
      🔄 Coletar
    </button>
    <button class="btn btn-secondary" onclick="previsao()">
      📊 Análise
    </button>
    <button class="btn btn-secondary" onclick="backtest()">
      🧪 Backtest
    </button>
  </div>

  <!-- SUGESTÃO -->
  <div class="section" id="secao-sugestao" style="display:none;">
    <div class="section-header">
      <div class="section-title">🎯 Sugestão de Jogo</div>
      <div class="section-badge">Próximo sorteio</div>
    </div>
    <div class="sugestao-grid" id="sugestao"></div>
  </div>

  <!-- RANKING GERAL -->
  <div class="section" id="secao-geral" style="display:none;">
    <div class="section-header">
      <div class="section-title">📈 Ranking Geral</div>
      <div class="section-badge">Top 15</div>
    </div>
    <div class="grid" id="ranking-geral"></div>
  </div>

  <!-- POR POSIÇÃO -->
  <div class="section" id="secao-posicao" style="display:none;">
    <div class="section-header">
      <div class="section-title">🔢 Ranking por Posição</div>
    </div>
    <div id="por-posicao"></div>
  </div>

  <!-- RESULTADOS -->
  <div class="section" id="secao-resultados">
    <div class="section-header">
      <div class="section-title">📋 Últimos Resultados</div>
    </div>
    <div class="grid" id="resultados">
      <div class="empty">Carregando resultados...</div>
    </div>
  </div>

</div>
<!-- CENTENAS MAIS ATRASADAS -->
<div class="section" id="secao-centenas">
  <div class="section-header">
    <div class="section-title">⏳ Centenas mais atrasadas</div>
    <div class="section-badge">Top 10</div>
  </div>
  <div class="grid" id="lista-centenas">
    <div class="empty">Carregando centenas...</div>
  </div>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbyQpGrbaq8q8xUB6n2qT6tabyg7cJ6zdw3l1V5yb1ftKWy2Hl8s1YdCsYZ0ARu_kk4KHg/exec';

async function api(action) {
  const url = API + '?action=' + encodeURIComponent(action);
  const res = await fetch(url);
  if (!res.ok) throw new Error('Erro HTTP ' + res.status);
  const json = await res.json();
  if (json.sucesso === false) throw new Error(json.erro || 'Erro na API');
  return json;
}

function setStatus(html, isError = false) {
  const el = document.getElementById('status');
  el.className = 'status' + (isError ? ' error' : '');
  el.innerHTML = `<div class="dot"></div><div>${html}</div>`;
}

async function status() {
  try {
    const r = await api('status');
    setStatus(`Sistema online · ${r.hora || ''}`);
  } catch (e) {
    setStatus('API indisponível · ' + e.message, true);
  }
}

async function coletar() {
  setStatus('Coletando resultados de hoje e ontem...');
  try {
    const r = await api('coletar');
    setStatus(`Coleta concluída · ${r.gravados || 0} registros gravados`);
    carregar();
  } catch (e) {
    setStatus('Erro na coleta: ' + e.message, true);
  }
}

async function carregar() {
  try {
    const r = await api('resultados');
    esconderPrevisao();

    const div = document.getElementById('resultados');
    div.innerHTML = '';

    if (!r.resultados || !r.resultados.length) {
      div.innerHTML = '<div class="empty">Nenhum resultado encontrado.<br>Toque em <strong>Coletar</strong>.</div>';
      return;
    }

    setStatus(`Mostrando ${r.resultados.length} sorteios recentes`);

    r.resultados.forEach(concurso => {
      const header = document.createElement('div');
      header.className = 'draw-header';
      header.innerHTML = `🕐 ${concurso.data || ''} · ${concurso.hora || ''}`;
      div.appendChild(header);

      (concurso.numeros || []).forEach((numero, pos) => {
        if (!numero) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="rank">Posição ${pos + 1}</div>
          <div class="num">${numero}</div>
        `;
        div.appendChild(card);
      });
    });
  } catch (e) {
    setStatus('Erro ao carregar: ' + e.message, true);
  }
}

async function previsao() {
  setStatus('Calculando análise estatística...');
  try {
    const r = await api('previsao');
    setStatus('Análise atualizada com sucesso');
    mostrarPrevisao(r);
  } catch (e) {
    setStatus('Erro na análise: ' + e.message, true);
  }
}

function mostrarPrevisao(r) {
  document.getElementById('secao-resultados').style.display = 'none';

  // Sugestão
  const sug = document.getElementById('sugestao');
  sug.innerHTML = '';
  (r.sugestao || []).forEach((num, i) => {
    const card = document.createElement('div');
    card.className = 'sugestao-card';
    card.innerHTML = `
      <div class="pos">Pos ${i + 1}</div>
      <div class="num">${num}</div>
    `;
    sug.appendChild(card);
  });
  document.getElementById('secao-sugestao').style.display = 'block';

  // Ranking Geral
  const geral = document.getElementById('ranking-geral');
  geral.innerHTML = '';
  (r.ranking_geral || []).forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="rank">#${i + 1}</div>
      <div class="num">${p.candidato}</div>
      <div class="meta">Score ${p.pontuacao}<br>F ${p.frequencia} · A ${p.atraso}</div>
    `;
    geral.appendChild(card);
  });
  document.getElementById('secao-geral').style.display = 'block';

  // Por Posição
  const posDiv = document.getElementById('por-posicao');
  posDiv.innerHTML = '';
  (r.por_posicao || []).forEach(item => {
    const box = document.createElement('div');
    box.className = 'pos-box';
    let html = `<div class="pos-title">Posição ${item.posicao}</div><div class="candidatos">`;
    (item.candidatos || []).forEach(c => {
      html += `
        <div class="candidato">
          <strong>${c.candidato}</strong>
          <span> · ${c.pontuacao} pts · F${c.frequencia} A${c.atraso}</span>
        </div>`;
    });
    html += '</div>';
    box.innerHTML = html;
    posDiv.appendChild(box);
  });
  document.getElementById('secao-posicao').style.display = 'block';
}

function esconderPrevisao() {
  document.getElementById('secao-sugestao').style.display = 'none';
  document.getElementById('secao-geral').style.display = 'none';
  document.getElementById('secao-posicao').style.display = 'none';
  document.getElementById('secao-resultados').style.display = 'block';
}

async function backtest() {
  setStatus('Executando backtest...');
  try {
    const r = await api('backtest');
    setStatus(`Backtest · ${r.testes || 0} testes · ${r.acertos || 0} acertos · ${r.taxa_acerto_top10 || 0}%`);
  } catch (e) {
    setStatus('Erro no backtest: ' + e.message, true);
  }
}

// Init
status();
carregar();
carregarCentenas();











async function carregarCentenas() {
  try {
    const r = await api('centenas');
    const div = document.getElementById('lista-centenas');
    div.innerHTML = '';

    if (!r.centenas || !r.centenas.length) {
      div.innerHTML = '<div class="empty">Nenhuma centena calculada.<br>Rode "Atualizar Centenas Quentes" na planilha.</div>';
      return;
    }

    r.centenas.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="rank">#${c.posicao}</div>
        <div class="num">${c.centena}</div>
        <div class="meta">Atraso: ${c.atraso}<br>Freq: ${c.frequencia}<br>${c.ultimo_numero || ''}</div>
      `;
      div.appendChild(card);
    });
  } catch (e) {
    document.getElementById('lista-centenas').innerHTML =
      '<div class="empty">Erro ao carregar centenas.</div>';
  }
}




  
</script>
</body>
</html>
