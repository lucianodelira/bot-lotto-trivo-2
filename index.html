<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotto Trivo Analyzer</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 16px;
    background: #0f0f0f;
    color: #fff;
  }
  .container { max-width: 1000px; margin: auto; }
  h1 { text-align: center; margin-bottom: 8px; }
  .status {
    padding: 14px;
    border-radius: 10px;
    background: #1c1c1c;
    margin-bottom: 14px;
    line-height: 1.45;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 14px;
    margin: 5px 0;
    border: 0;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    background: #2a2a2a;
    color: #fff;
  }
  button:hover { background: #3a3a3a; }
  .section { margin-top: 22px; }
  .section-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #aaa;
  }
  .sugestao {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .sugestao .card {
    background: #1a3a2a;
    border: 1px solid #2d6a4f;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .card {
    background: #1c1c1c;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
  }
  .numero {
    font-size: 22px;
    font-weight: bold;
    margin: 4px 0;
  }
  .pequeno {
    font-size: 12px;
    opacity: 0.7;
  }
  .pos = await api('previsao');

    mostrarPrevisao(r);
  } catch (e) {
    mostrar('Erro: ' + e.message);
  }
}

function mostrarPrevisao(r) {
  document.getElementById('secao-resultados').style.display = 'none';

  // Sugestão
  const sugDiv = document.getElementById('sugestao');
  sugDiv.innerHTML = '';
  (r.sugestao || []).forEach((num, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="pequeno">Pos ' + (i + 1) + '</div><div class="numero">' + num + '</div>';
    sugDiv.appendChild(card);
  });
  document.getElementById('secao-sugestao').style.display = 'block';

  // Ranking Geral
  const geralDiv = document.getElementById('ranking-geral');
  geralDiv.innerHTML = '';
  (r.ranking_geral || []).forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="pequeno">#' + (i + 1) + '</div>' +
      '<div class="numero">' + p.candidato + '</div>' +
      '<div class="pequeno">Score: ' + p.pontuacao + '</div>' +
      '<div class="pequeno">Freq: ' + p.frequencia + ' | Atraso: ' + p.atraso + '</div>';
    geralDiv.appendChild(card);
  });
  document.getElementById('secao-geral').style.display = 'block';

  // Por Posição
  const posDiv = document.getElementById('por-posicao');
  posDiv.innerHTML = '';
  (r.por_posicao || []).forEach(item => {
    const box = document.createElement('div');
    box.className = 'posicao-box';
    let html = '<div class="posicao-title">Posição ' + item.posicao + '</div><div class="candidatos">';
    (item.candidatos || []).forEach(c => {
      html += '<div class="candidato"><strong>' + c.candidato + '</strong> · ' +
              c.pontuacao + ' pts · F:' + c.frequencia + ' A:' + c.atraso + '</div>';
    });
    html += '</div>';
    box.innerHTML = html;
    posDiv.appendChild(box);
  });
  document.getElementById('secao-posicao').style.display = 'block';
}

function esconderPrevisao() {
  document.getElementById('secao-sugestao').style.display = 'none';
  document.getElementById('secao-geral').style.display = 'none';
  document.getElementById('secao-posicao').style.display = 'none';
  document.getElementById('secao-resultados').style.display = 'block';
}

async function backtest() {
  mostrar('Executando backtest...');
  try {
    const r = await api('backtest');
    mostrar('🧪 BACKTEST<br><br>Testes: ' + (r.testes || 0) +
            '<br>Acertos Top 10: ' + (r.acertos || 0) +
            '<br>Taxa: ' + (r.taxa_acerto_top10 || 0) + '%');
  } catch (e) {
    mostrar('Erro no backtest: ' + e.message);
  }
}

function mostrar(texto) {
  document.getElementById('status').innerHTML = texto;
}

status();
carregar();
</script>
</body>
</html>
